name: Build static POI data

# Weekly refresh of the static cell dataset, plus manual runs.
# Nothing generated is ever committed: cell files travel from the build
# matrix into the deploy job as artifacts, and the last published set is
# kept as a release asset (data-latest) so a partial run can merge onto it.
#
# The weekly run is split into four rotation groups (1-4, set per country in
# config/countries.json). A scheduled run builds only the enabled countries
# whose group matches `ISO week % 4 + 1`, so every country refreshes once per
# four weeks and one Monday downloads roughly 8 GB instead of ~31 GB. Manual
# runs that name countries with `only` are exact and ignore groups entirely.

on:
  schedule:
    # Mondays 03:17 UTC. Note: GitHub disables scheduled workflows after
    # 60 days without repository activity — see README.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated ISO codes to rebuild (e.g. PT or US-CA). When set, ONLY these are built — enabled or not, groups ignored. Empty = this ISO week''s rotation group.'
        required: false
        type: string
        default: ''
      all:
        description: 'Ignore the rotation and rebuild every enabled country (full refresh). `only` wins over this.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      filters: ${{ steps.select.outputs.filters }}
      group: ${{ steps.select.outputs.group }}
      week: ${{ steps.select.outputs.week }}
    steps:
      - uses: actions/checkout@v4

      - name: Select countries
        id: select
        env:
          ONLY: ${{ github.event.inputs.only }}
          ALL: ${{ github.event.inputs.all }}
        run: |
          set -euo pipefail
          only="$(printf '%s' "${ONLY:-}" \
            | tr ',' '\n' \
            | sed 's/[[:space:]]//g' \
            | tr '[:lower:]' '[:upper:]' \
            | sed '/^$/d' \
            | sort -u \
            | paste -sd, -)"
          # ISO week of this run -> rotation group 1-4. The schedule fires
          # Mondays 03:17 UTC, so this is the week the run belongs to.
          week="$(date -u +%V)"
          group=$(( 10#$week % 4 + 1 ))
          if [ -n "$only" ]; then
            selector=only
          elif [ "${ALL:-false}" = "true" ]; then
            selector=all
          else
            selector=group
          fi
          filters="$(jq -r '[.categories[].filter] | join(" ")' config/countries.json)"
          matrix="$(
            jq -c --arg only "$only" --arg sel "$selector" \
              --argjson group "$group" --arg week "$week" '
              ($only | split(",") | map(select(length > 0))) as $wanted
              | (.countries | map(.code)) as $known
              | (.countries
                  | map(select(
                      (.group as $g
                       | if ($g | type) == "number"
                         then (($g >= 1) and ($g <= 4) and (($g | floor) == $g))
                         else false end)
                      | not))
                  | map(.code)) as $badGroup
              | if ($badGroup | length) > 0
                then error("country code(s) without a valid group (integer 1-4): \($badGroup | join(", "))")
                else . end
              | ($wanted - $known) as $unknown
              | if ($unknown | length) > 0
                then error("unknown country code(s): \($unknown | join(", "))")
                else . end
              | [ .countries[] as $c
                  | select(if $sel == "only"
                      then ($wanted | index($c.code)) != null
                      elif $sel == "all"
                      then $c.enabled
                      else ($c.enabled and $c.group == $group) end)
                  | { code: $c.code, name: $c.name, geofabrik: $c.geofabrik } ]
              | if length == 0
                then error("nothing to build: \(if $sel == "group" then "no enabled country in group \($group) (ISO week \($week))" else "no enabled country" end)")
                else { include: . } end
            ' config/countries.json
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "filters=$filters" >> "$GITHUB_OUTPUT"
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          {
            echo "### Countries in this run"
            echo
            case "$selector" in
              only) echo "Selection: \`only\` — exactly the requested codes, groups ignored." ;;
              all) echo "Selection: \`all\` — every enabled country, groups ignored." ;;
              *) echo "Selection: rotation group **$group** (ISO week $week: $week % 4 + 1)." ;;
            esac
            echo
            jq -r '.include[] | "- `\(.code)` — \(.name) (`\(.geofabrik)`)"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.code }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Keep going so one bad country does not hide the others: the deploy job
      # publishes whatever succeeded and keeps a failed country's last good
      # copy from the data-latest baseline.
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Runner disk before download
        run: df -h / | sed -n '1,2p'

      - name: Install osmium-tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Download Geofabrik extract
        env:
          GEOFABRIK: ${{ matrix.geofabrik }}
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL --retry 3 --retry-delay 10 --connect-timeout 30 \
            -o work/input.osm.pbf \
            "https://download.geofabrik.de/${GEOFABRIK}-latest.osm.pbf"
          ls -lh work/input.osm.pbf

      - name: Resolve OSM replication timestamp
        id: ts
        env:
          GEOFABRIK: ${{ matrix.geofabrik }}
        run: |
          set -euo pipefail
          # Authoritative source: Geofabrik writes the extract's OSM
          # replication timestamp into the PBF header.
          ts="$(osmium fileinfo -e work/input.osm.pbf \
            | sed -n 's/.*osmosis_replication_timestamp=//p' | head -n 1)"
          if [ -z "$ts" ]; then
            echo "::warning::no replication timestamp in the PBF header; trying state.txt"
            ts="$(curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              "https://download.geofabrik.de/${GEOFABRIK}-updates/state.txt" \
              | sed -n 's/^timestamp=//p' | head -n 1 | sed 's/\\:/:/g' || true)"
          fi
          if [ -z "$ts" ]; then
            echo "::warning::state.txt unavailable; falling back to Last-Modified"
            lm="$(curl -fsSI --retry 3 --max-time 60 \
              "https://download.geofabrik.de/${GEOFABRIK}-latest.osm.pbf" \
              | tr -d '\r' | sed -n 's/^[Ll]ast-[Mm]odified: //p' | tail -n 1)"
            ts="$(date -u -d "$lm" +%Y-%m-%dT%H:%M:%SZ)"
          fi
          if ! printf '%s' "$ts" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; then
            echo "::error::could not determine a valid OSM timestamp (got '$ts')"
            exit 1
          fi
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "OSM data timestamp: $ts"

      - name: Filter tags and export GeoJSON
        env:
          FILTERS: ${{ needs.prepare.outputs.filters }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          osmium tags-filter work/input.osm.pbf ${FILTERS} -o work/filtered.osm.pbf --overwrite
          osmium fileinfo -e work/filtered.osm.pbf \
            | sed -n '/Number of nodes/p;/Number of ways/p;/Number of relations/p'
          # -u type_id is required: without it `osmium export` omits the OSM
          # id entirely and the split step would (correctly) reject every
          # feature as id-less.
          osmium export work/filtered.osm.pbf -f geojsonseq -u type_id \
            -o work/pois.geojsonseq --overwrite
          wc -l work/pois.geojsonseq
          du -sh work

      - name: Split into cells
        env:
          CODE: ${{ matrix.code }}
          TS: ${{ steps.ts.outputs.ts }}
          SOURCE: https://download.geofabrik.de/${{ matrix.geofabrik }}-latest.osm.pbf
        run: |
          set -euo pipefail
          node scripts/split-cells.mjs \
            --country "$CODE" \
            --input work/pois.geojsonseq \
            --out "dist/v1/$CODE" \
            --timestamp "$TS" \
            --source "$SOURCE" \
            --config config/countries.json
          jq -e '.total > 0 and .cells > 0' "dist/v1/$CODE/manifest.json" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.code }}
          path: dist/v1/${{ matrix.code }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Merge and deploy
    needs: [prepare, build]
    # Publish whatever succeeded. A failed country is not dropped: the restore
    # step below puts its last good copy back from the data-latest baseline,
    # and the report step names the countries that were not refreshed. A run
    # where every build failed still publishes nothing — the "no country
    # artifacts" guard fails the job before the Pages upload — and turns red.
    if: always() && needs.prepare.result == 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        # Errors when zero artifacts match, which is what an all-failed run
        # looks like. Keep going so the report step can name those countries;
        # the explicit guard below then fails the job without publishing.
        continue-on-error: true
        with:
          pattern: data-*
          path: incoming

      - name: Restore previously published countries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist baseline
          if gh release view data-latest >/dev/null 2>&1; then
            if gh release download data-latest -p dataset.tar.gz -D baseline --clobber; then
              tar -xzf baseline/dataset.tar.gz -C dist
              echo "Restored baseline from data-latest"
            else
              echo "::warning::data-latest has no dataset.tar.gz; continuing without a baseline"
            fi
          else
            echo "No data-latest release yet; publishing a fresh set"
          fi

      - name: Report countries that were not refreshed
        if: needs.build.result != 'success'
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail
          printf '\n### Countries not refreshed in this run\n\n| Code | Status |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for cc in $(jq -r '.include[].code' <<<"$MATRIX"); do
            if [ -d "incoming/data-$cc" ]; then continue; fi
            failed=$((failed + 1))
            if [ -d "dist/v1/$cc" ]; then
              printf '| `%s` | build failed — previous published data kept |\n' "$cc" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=$cc::$cc build failed; previous published data kept"
            else
              printf '| `%s` | build failed — no baseline, not published |\n' "$cc" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=$cc::$cc build failed and no published baseline exists"
            fi
          done
          echo "merge-manifest: $failed country build(s) failed; see the summary" >&2

      - name: Overlay freshly built countries
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for src in incoming/data-*; do
            code="${src##*/data-}"
            mkdir -p dist/v1
            rm -rf "dist/v1/$code"
            cp -a "$src" "dist/v1/$code"
            found=$((found + 1))
            echo "overlaid $code"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no country artifacts were downloaded"
            exit 1
          fi

      - name: Merge root manifest
        run: node scripts/merge-manifest.mjs --dir dist --config config/countries.json

      - name: Summarise
        env:
          GROUP: ${{ needs.prepare.outputs.group }}
          WEEK: ${{ needs.prepare.outputs.week }}
        run: |
          {
            echo "**Rotation:** ISO week \`$WEEK\` → group \`$GROUP\`"
            echo
            jq -r '"**\(.total) POIs** in \(.cells) cells across \(.countries | length) countries\n\nData timestamp: `\(.datasetTimestamp)`", "", "| Code | POIs | Cells | JSON |", "| --- | ---: | ---: | ---: |", (.countries | to_entries[] | "| \(.key) | \(.value.pois) | \(.value.cells) | \(.value.bytes) B |")' dist/manifest.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Save published set as data-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf dataset.tar.gz -C dist .
          ls -lh dataset.tar.gz
          if ! gh release view data-latest >/dev/null 2>&1; then
            gh release create data-latest \
              --title "Latest published POI dataset" \
              --notes "Rolling snapshot of the dataset currently served by GitHub Pages, used as the merge baseline for partial (only=...) runs."
          fi
          gh release upload data-latest dataset.tar.gz --clobber
